# =============================================================================
# eTour frontend - nginx (HTTPS)
# =============================================================================

upstream etour_backend {
    server backend:8080;
}

# --------------------------------------------------------------------
# HTTP -> HTTPS Redirect
# --------------------------------------------------------------------
server {
    listen 80;
    server_name etourvita.shop www.etourvita.shop;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }


    location / {
        return 301 https://$host$request_uri;
    }
}

# --------------------------------------------------------------------
# HTTPS
# --------------------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name etourvita.shop www.etourvita.shop;

    ssl_certificate     /etc/letsencrypt/live/etourvita.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/etourvita.shop/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25M;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  443;

    location /api/ {
        proxy_pass http://etour_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # Notification microservice. Everything under /svc/ is served by it and
    # nothing under /api/ is, so it can never shadow a backend route.
    #
    # The hostname is resolved PER REQUEST, not at config load, and that is the
    # whole point of the odd-looking variable below. nginx resolves a plain
    # `proxy_pass http://name` once at startup and REFUSES TO START if the name
    # is missing - so a notification service that is stopped, crashed or not yet
    # built would take nginx down with it and make BOTH backends unreachable.
    # Assigning the target to a variable defers resolution to request time, so a
    # missing service degrades to a 502 on /svc/ only, and the rest of the site
    # carries on. That keeps this microservice genuinely optional.
    #
    # 127.0.0.11 is Docker's embedded DNS server, and $request_uri has to be
    # appended by hand because a proxy_pass containing a variable does not pass
    # the request URI on automatically.
    location /svc/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $notify_upstream http://notification-service:8085;
        proxy_pass $notify_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    location /oauth2/authorization/ {
        proxy_pass http://etour_backend;
        proxy_http_version 1.1;
    }

    location /login/oauth2/ {
        proxy_pass http://etour_backend;
        proxy_http_version 1.1;
    }

    location /uploads/ {
        proxy_pass http://etour_backend;
        proxy_http_version 1.1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
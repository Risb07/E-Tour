spring.application.name=Backend

# ===========================================================================
# LOCAL DEVELOPMENT DEFAULTS
#
# This file is committed, so it must not contain a real password. Every value
# below can be overridden by an environment variable (the ${VAR:default}
# syntax means "use $VAR if set, otherwise use default").
#
# To run locally you normally only need to change ONE thing: DB_PASSWORD.
# Either edit the default below, or set the env var before starting:
#     Windows (PowerShell):  $env:DB_PASSWORD="yourpassword"
#     macOS/Linux:           export DB_PASSWORD=yourpassword
#
# In production, set every credential via environment variables and never
# rely on these defaults.
# ===========================================================================

# --- Database -------------------------------------------------------------
# Create the schema first:  CREATE DATABASE etour;
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/etour?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 'update' lets Hibernate create/alter tables to match the entities. Fine for
# development. In production prefer 'validate' plus a migration tool.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
# Avoids the "lazy collection could not be initialized" 500s that otherwise
# appear when a controller serialises a lazily-loaded association.
spring.jpa.open-in-view=true

# --- JWT ------------------------------------------------------------------
# Base64 secret that decodes to at least 32 bytes. Generate one with:
#     openssl rand -base64 48
# If left EMPTY the app generates a random key at startup so it still runs -
# but every restart invalidates all tokens (everyone gets logged out), and a
# startup warning is logged. Always set JWT_SECRET in production.
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Google OAuth 2.0 sign-in --------------------------------------------
# Optional. If GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET are left EMPTY the
# whole OAuth2 login path stays switched off (see OAuth2SecurityConfig) and
# the app behaves exactly as before - email/password login is unaffected.
#
# To enable:
#   1. Google Cloud Console -> APIs & Services -> Credentials
#   2. Create an "OAuth client ID" of type "Web application"
#   3. Authorised redirect URI:
#        http://localhost:8080/login/oauth2/code/google
#      (in production swap in your real backend host, https only)
#   4. Export the two values before starting the backend:
#        Windows (PowerShell):  $env:GOOGLE_CLIENT_ID="..." ; $env:GOOGLE_CLIENT_SECRET="..."
#        macOS/Linux:           export GOOGLE_CLIENT_ID=...  GOOGLE_CLIENT_SECRET=...
# These deliberately use eTour's own "app.oauth2.*" namespace rather than
# Spring Boot's "spring.security.oauth2.client.registration.*". Boot validates
# the latter at startup and refuses to boot if a registration exists with a
# blank client-id - which would mean nobody could run this project without
# first creating Google credentials. With our own namespace the registration
# is built in code (GoogleOAuth2ClientConfig) only when both values are
# actually present, so a blank config simply leaves the feature switched off.
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# {baseUrl} resolves to whatever host the backend is actually reached on, so
# this one line works for localhost and production alike. It must match the
# redirect URI registered in the Google Cloud Console exactly.
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}

# Where the backend sends the browser once Google has authenticated the user.
# The eTour JWT is appended as a query parameter and the SPA stores it exactly
# like it stores the token from /api/auth/login.
app.oauth2.frontend-redirect-uri=${OAUTH2_FRONTEND_REDIRECT_URI:http://localhost:5173/oauth2/callback}

# --- File uploads (tour media, Excel bulk upload) -------------------------
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

# --- CORS: comma-separated list of allowed frontend origins ---------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# --- Mail (BRD 3.7 - e-mails the PDF receipt after payment) ---------------
# Optional. With no username/password, sending is skipped and logged; it never
# blocks a payment (see ReceiptEmailService). The receipt is still downloadable
# from the dashboard either way.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:noreply@etour.example.com}

# --- Notification microservice --------------------------------------------
# Receipt e-mail is no longer sent from this application. It is queued with the
# notification service, which owns the templates, the single retry and the
# delivery log. The spring.mail.* settings above are now unused by this backend
# and are kept only so the same .env drives the microservice.
#
# Set enabled=false to stop queueing entirely (nothing is sent, and nothing
# falls back to direct SMTP - the receipt stays downloadable from
# GET /api/invoices/booking/{id}/receipt).
app.notification.base-url=${NOTIFICATION_BASE_URL:http://notification-service:8085}
app.notification.enabled=${NOTIFICATION_ENABLED:true}

# --- Business config ------------------------------------------------------
# GST rate as a decimal fraction (0.05 = 5%).
app.invoice.gst-rate=${INVOICE_GST_RATE:0.05}

# Payment provider. "simulated" records a successful payment without moving
# money. Add a PaymentGateway implementation and change this to plug in a real
# provider - no business logic changes needed.
app.payment.provider=${PAYMENT_PROVIDER:simulated}

# --- Error responses ------------------------------------------------------
# Include the message on error responses so the frontend can show something
# useful instead of a bare status code.
server.error.include-message=always



# ===========================================================================
# TEST PROFILE
#
# Activated by @ActiveProfiles("test") on tests that boot a Spring context.
# It overrides only what a test must not touch - the database and the JWT
# secret - and inherits everything else from
# src/main/resources/application.properties.
#
# Nothing here affects `mvn spring-boot:run` or the packaged jar: this file
# lives in src/test/resources and never ships.
# ===========================================================================

# --- Database: in-memory H2, created fresh per run and dropped after -------
# MySQL compatibility mode keeps the entity mappings behaving as in production.
spring.datasource.url=jdbc:h2:mem:etour_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# create-drop, never `update`: a test run must not be able to alter a real
# schema even if this were somehow pointed at one.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# --- Deterministic secret so issued tokens are stable across a run ---------
# Base64 decoding to 32+ bytes. Test-only value, never used outside tests.
jwt.secret=dGVzdC1vbmx5LXNlY3JldC1rZXktZm9yLWV0b3VyLWp1bml0LXN1aXRlLTEyMzQ1Njc4
jwt.expiration-ms=3600000

# --- Keep tests offline ----------------------------------------------------
# Blank mail credentials already make ReceiptEmailService skip sending, and
# blank Google credentials leave the OAuth2 path switched off. Both are the
# documented "feature disabled" state, so no test opens a socket.
spring.mail.username=
spring.mail.password=
app.oauth2.google.client-id=
app.oauth2.google.client-secret=

logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=WARN

# =============================================================================
# eTour frontend - nginx for LOCAL development (plain HTTP, no TLS)
#
# The image ships etour-frontend/nginx.conf, which terminates TLS for
# etourvita.shop using Let's Encrypt certificates. Those certificates only exist
# on the server, so on a laptop nginx would exit at startup with
# "cannot load certificate".
#
# docker-compose.local.yml mounts THIS file over the shipped one, giving the
# same routing on plain HTTP. Neither the image nor etour-frontend/nginx.conf is
# modified - the server configuration stays exactly as deployed.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml \
#                  --profile dotnet up --build
# =============================================================================

upstream etour_backend {
    server backend:8080;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Must be >= spring.servlet.multipart.max-request-size / the .NET equivalent,
    # or uploads fail at the proxy with a 413 before reaching the API.
    client_max_body_size 25M;

    # Same headers the production config sets, minus the https hardcoding, so
    # both backends reconstruct the public URL correctly behind the proxy.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Matches the container HEALTHCHECK in etour-frontend/Dockerfile.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK";
    }

    location /api/ {
        proxy_pass http://etour_backend;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
    }

    # Notification microservice. Everything under /svc/ is served by it and
    # nothing under /api/ is, so it can never shadow a backend route.
    #
    # The hostname is resolved PER REQUEST, not at config load, and that is the
    # whole point of the odd-looking variable below. nginx resolves a plain
    # `proxy_pass http://name` once at startup and REFUSES TO START if the name
    # is missing - so a notification service that is stopped, crashed or not yet
    # built would take nginx down with it and make BOTH backends unreachable.
    # Assigning the target to a variable defers resolution to request time, so a
    # missing service degrades to a 502 on /svc/ only, and the rest of the site
    # carries on. That keeps this microservice genuinely optional.
    #
    # 127.0.0.11 is Docker's embedded DNS server, and $request_uri has to be
    # appended by hand because a proxy_pass containing a variable does not pass
    # the request URI on automatically.
    location /svc/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $notify_upstream http://notification-service:8085;
        proxy_pass $notify_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Google sign-in entry point. Served by Spring under the java profile and by
    # JavaCompatOAuthController under the dotnet profile - same path either way.
    location /oauth2/authorization/ {
        proxy_pass http://etour_backend;
        proxy_http_version 1.1;
    }

    # Google's redirect target. Both backends use this path, so one Authorized
    # redirect URI in the Google console covers both.
    location /login/oauth2/ {
        proxy_pass http://etour_backend;
        proxy_http_version 1.1;
    }

    location /uploads/ {
        proxy_pass http://etour_backend;
        proxy_http_version 1.1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA history fallback. Note /oauth2/callback is deliberately NOT proxied -
    # it is a React route and falls through to here.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
